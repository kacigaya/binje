name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bunx next typegen
      - run: bunx tsc --noEmit
  mobile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run mobile:typecheck
      - run: bun run mobile:lint
      - run: bun run mobile:test --runInBand
      - run: bunx expo install --check
        working-directory: apps/mobile
      - run: bunx expo export --platform ios --output-dir ../../.mobile-export-ios
        working-directory: apps/mobile
      - run: bunx expo export --platform android --output-dir ../../.mobile-export-android
        working-directory: apps/mobile
