name: Release Android APK

# Publish a GitHub release (tag vX.Y.Z) to build the APK on EAS and attach it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.event.release.tag_name }}

jobs:
  apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check tag matches app version
        working-directory: apps/mobile
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match app.json version $version"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK on EAS
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url=$(node -p "require(process.argv[1])[0].artifacts.buildUrl" "$RUNNER_TEMP/build.json")
          curl -fsSL "$url" -o "$RUNNER_TEMP/binje-$TAG.apk"
          cd "$RUNNER_TEMP" && sha256sum "binje-$TAG.apk" > "binje-$TAG.apk.sha256"
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/binje-$TAG.apk" "$RUNNER_TEMP/binje-$TAG.apk.sha256" --clobber
